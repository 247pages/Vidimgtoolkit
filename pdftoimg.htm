<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Image Converter</title>
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Upload Zone */
        .upload-zone {
            background-color: var(--bg-secondary);
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s;
            margin-bottom: 2rem;
        }

        .upload-zone:hover {
            border-color: var(--accent);
        }

        .upload-zone input {
            display: none;
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: inline-block;
        }

        /* Action Bar */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-secondary);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s;
        }

        .action-bar.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.625rem 1.25rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.875rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            background-color: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--border);
        }

        .action-group {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        /* Grid Output */
        .pages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .page-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            transition: border-color 0.2s, transform 0.2s;
        }

        .page-card:hover {
            border-color: #475569;
            transform: translateY(-2px);
        }

        .page-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .canvas-container {
            width: 100%;
            aspect-ratio: 1 / 1.414; /* Standard A4 ratio aspect */
            background-color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card-meta {
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
        }

        .page-number {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Custom Checkbox overlay */
        .select-overlay {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 10;
        }

        .select-checkbox {
            width: 1.25rem;
            height: 1.25rem;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Loading Spinner */
        .loader {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            display: none;
        }

        @media (max-width: 640px) {
            .action-bar {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }
            .action-group {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>PDF to Image Converter</h1>
        <p>Convert pages into clean high-resolution images fully locally</p>
    </header>

    <label class="upload-zone" id="drop-zone">
        <span class="upload-icon">📂</span>
        <h3>Click or Drag & Drop PDF here</h3>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.5rem;">Supports standard PDF documents</p>
        <input type="file" id="file-input" accept="application/pdf">
    </label>

    <div class="action-bar" id="action-bar">
        <div class="action-group">
            <button class="btn btn-secondary" id="btn-select-all">Select All</button>
            <button class="btn btn-secondary" id="btn-clear-selection">Clear</button>
        </div>
        <div class="action-group">
            <span id="selection-status" style="font-size: 0.875rem; color: var(--text-muted);">0 pages selected</span>
            <button class="btn" id="btn-download-selected" disabled>Download Selected</button>
        </div>
    </div>

    <div class="loader" id="loader">Processing document pages...</div>
    <div class="pages-grid" id="pages-grid"></div>
</div>

<script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const pagesGrid = document.getElementById('pages-grid');
    const loader = document.getElementById('loader');
    const actionBar = document.getElementById('action-bar');
    const btnSelectAll = document.getElementById('btn-select-all');
    const btnClearSelection = document.getElementById('btn-clear-selection');
    const btnDownloadSelected = document.getElementById('btn-download-selected');
    const selectionStatus = document.getElementById('selection-status');

    let generatedImages = {}; // Holds map of pageNum -> dataURL

    // Drag and drop handling
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--accent)';
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--border)';
        }, false);
    });

    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length && files[0].type === 'application/pdf') {
            handlePDF(files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            handlePDF(e.target.files[0]);
        }
    });

    // Main PDF Processing Function
    async function handlePDF(file) {
        // Reset application state
        pagesGrid.innerHTML = '';
        generatedImages = {};
        updateSelectionUI();
        actionBar.classList.remove('visible');
        loader.style.display = 'block';

        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            
            loader.style.display = 'none';
            actionBar.classList.add('visible');

            // Render loop for each page
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                
                // Define a crisp render scale factor (2x looks clear, 1.5x balance performance)
                const viewport = page.getViewport({ scale: 1.5 });
                
                // Create UI elements
                const card = document.createElement('div');
                card.className = 'page-card';
                card.dataset.pageNum = pageNum;

                const canvasContainer = document.createElement('div');
                canvasContainer.className = 'canvas-container';

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                canvasContainer.appendChild(canvas);
                card.appendChild(canvasContainer);

                // Checkbox overlay configuration
                const overlay = document.createElement('div');
                overlay.className = 'select-overlay';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'select-checkbox';
                checkbox.addEventListener('change', () => {
                    card.classList.toggle('selected', checkbox.checked);
                    updateSelectionUI();
                });
                overlay.appendChild(checkbox);
                card.appendChild(overlay);

                // Meta row layout
                const metaRow = document.createElement('div');
                metaRow.className = 'card-meta';
                
                const label = document.createElement('span');
                label.className = 'page-number';
                label.textContent = `Page ${pageNum}`;
                
                const dlBtn = document.createElement('button');
                dlBtn.className = 'btn btn-secondary';
                dlBtn.style.padding = '0.375rem 0.75rem';
                dlBtn.style.fontSize = '0.75rem';
                dlBtn.textContent = 'Download';
                dlBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    downloadSingleImage(pageNum);
                });

                metaRow.appendChild(label);
                metaRow.appendChild(dlBtn);
                card.appendChild(metaRow);
                pagesGrid.appendChild(card);

                // Optional: click card to toggle selection
                canvasContainer.addEventListener('click', () => {
                    checkbox.checked = !checkbox.checked;
                    card.classList.toggle('selected', checkbox.checked);
                    updateSelectionUI();
                });

                // Asynchronously render PDF contents directly onto canvas
                await page.render({ canvasContext: context, viewport: viewport }).promise;
                
                // Save canvas content to reference structure immediately after draw complete
                generatedImages[pageNum] = canvas.toDataURL('image/png');
            }
        } catch (error) {
            console.error(error);
            alert('Error rendering this PDF file. Please verify document health.');
            loader.style.display = 'none';
        }
    }

    // Single trigger helper
    function downloadSingleImage(pageNum) {
        const dataUrl = generatedImages[pageNum];
        if (!dataUrl) return;
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = `page_${pageNum}.png`;
        link.click();
    }

    // State validation managers
    function updateSelectionUI() {
        const checkedBoxes = document.querySelectorAll('.select-checkbox:checked');
        const count = checkedBoxes.length;
        
        selectionStatus.textContent = `${count} page${count === 1 ? '' : 's'} selected`;
        btnDownloadSelected.disabled = count === 0;
    }

    // Bulk selection utilities
    btnSelectAll.addEventListener('click', () => {
        document.querySelectorAll('.select-checkbox').forEach(cb => {
            cb.checked = true;
            cb.closest('.page-card').classList.add('selected');
        });
        updateSelectionUI();
    });

    btnClearSelection.addEventListener('click', () => {
        document.querySelectorAll('.select-checkbox').forEach(cb => {
            cb.checked = false;
            cb.closest('.page-card').classList.remove('selected');
        });
        updateSelectionUI();
    });

    // Programmatic down-loader for all valid selected paths
    btnDownloadSelected.addEventListener('click', () => {
        const checkedBoxes = document.querySelectorAll('.select-checkbox:checked');
        checkedBoxes.forEach((cb, index) => {
            const card = cb.closest('.page-card');
            const pageNum = card.dataset.pageNum;
            
            // Stagger downloads slightly to prevent browser blocking multiple simultaneous files
            setTimeout(() => {
                downloadSingleImage(pageNum);
            }, index * 250);
        });
    });
</script>
</body>
</html>
